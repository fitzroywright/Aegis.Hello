name: Aegis Hello CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aegis.Hello
        uses: actions/checkout@v4

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          path: Common/Common.Registration

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common/Common.Diagnostics

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Aegis.Hello.slnx -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          dotnet build Aegis.Hello.slnx --no-restore --configuration Release -p:CommonRoot="${{ github.workspace }}/Common" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -m1 -E '(: error |error (CS|MSB|NU)[0-9]+)' build.log | tr '\n' ' ' | cut -c1-130 > first-error.txt || true
          fi
          exit "$code"

      - name: Publish build diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            state=success
            description="Aegis.Hello build passed"
          else
            state=failure
            description="$(cat first-error.txt 2>/dev/null || echo 'Aegis.Hello build failed')"
          fi
          description="$(printf '%s' "$description" | cut -c1-140)"
          payload="$(jq -n --arg state "$state" --arg context "aegis/build" --arg description "$description" --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "$payload" || echo "warning: commit status publishing unavailable"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
